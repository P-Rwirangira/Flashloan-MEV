# Base MEV Platform Configuration
# This is the default configuration for the Base MEV platform

# Phase Configuration
phases:
  arbitrage:
    enabled: true
    priority: 1
  liquidations:
    enabled: false  # Enable for Phase 2
    priority: 2
  stablePoolRebalancing:
    enabled: false  # Enable for Phase 3
    priority: 3

# Feature Flags
featureFlags:
  enableLiquidationMonitoring: false
  enableStablePoolMonitoring: false
  enableAdvancedRouting: true
  enablePerformanceOptimizations: true
  enableMempoolMonitoring: false  # ❌ DISABLED: Not needed for cross-DEX arbitrage (only for backrun)
  enableCompetitionTracking: true

# Graceful Degradation
gracefulDegradation:
  enabled: true
  fallbackToArbitrageOnly: true
  maxConsecutiveFailures: 10
  autoRecovery: true
  recoveryCheckIntervalMs: 60000

# Network configuration
network:
  chainId: 8453  # Base mainnet
  name: "base"
  rpcUrl: "${BASE_RPC_URL:https://base-mainnet.g.alchemy.com/v2/FLUpiiYxfMvm29kJsQZBY}"
  wsUrl: "${BASE_WS_URL:wss://base-mainnet.g.alchemy.com/v2/FLUpiiYxfMvm29kJsQZBY}"
  fallbackRpcs:
    - "https://base-rpc.publicnode.com"
    - "https://base.llamarpc.com"
    - "https://base.meowrpc.com"
    - "https://mainnet.base.org"
    - "https://1rpc.io/base"
    - "https://rpc.ankr.com/base"

# DexScreener Integration (Zero RPC for monitoring!)
dexscreener:
  enabled: true
  apiUrl: "https://api.dexscreener.com/latest/dex"
  
  # Client configuration
  maxRequestsPerMinute: 250
  cacheTimeMs: 5000
  retryDelayMs: 2000
  maxRetries: 3
  timeout: 10000
  
  # Monitor configuration
  chain: "base"
  poolAddresses: []  # Will be populated from allowedPools
  minLiquidityUsd: 100000
  minVolume24hUsd: 10000
  updateIntervalMs: 5000
  enableAutoDiscovery: false
  maxStaleDataMs: 30000
  
  # Cross-DEX arbitrage scanner
  crossDexScanner:
    enabled: true
    minSpreadPercent: 0.1
    minProfitUsd: 8
    minConfidenceScore: 70
    maxPriceImpactPercent: 2
    scanIntervalMs: 5000
  
  # Multi-hop arbitrage scanner
  multiHopScanner:
    enabled: true
    maxHops: 4
    minSpreadPercent: 0.2
    minProfitUsd: 15
    minConfidenceScore: 60
    maxPriceImpactPercent: 3
    scanIntervalMs: 10000
    enabledTokens:
      - "0x4200000000000000000000000000000000000006"  # WETH
      - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC
      - "0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA"  # USDbC
  
  # Trending pair discovery
  discovery:
    enabled: true
    minLiquidityUsd: 500000
    minVolume24hUsd: 100000
    minVolume1hUsd: 10000
    maxPoolAge: 0  # 0 = no age limit
    scanIntervalMs: 300000  # 5 minutes
    maxNewPoolsPerScan: 10
    whitelistedTokens:
      - "0x4200000000000000000000000000000000000006"  # WETH
      - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC
    blacklistedTokens: []
  
  # Orchestrator configuration
  orchestrator:
    enableCrossDex: true
    enableMultiHop: true
    enableDiscovery: true
    validateWithRpc: true
    maxPriceDiscrepancy: 1.0  # 1% max discrepancy
    executionEnabled: false
    paperTradingMode: true

# Gas configuration
gas:
  maxGasPrice: "${MAX_GAS_PRICE:50}"  # 50 gwei
  gasLimit: 500000
  priorityFee: "${PRIORITY_FEE:2}"
  baseFeeMultiplier: 1.2

# Timing configuration
timing:
  maxLatencyMs: 200
  timeoutMs: 5000
  retryDelayMs: 100
  maxRetries: 3
  simulationTimeoutMs: 50

# Security configuration
security:
  maxConcurrentTx: 5
  maxDailyLoss: 1000  # USD
  emergencyStop: false
  allowedCallers: []
  rateLimits:
    requestsPerSecond: 100
    burstSize: 200

# Performance configuration
performance:
  maxLatencyMs: 150
  simulationTimeoutMs: 50
  maxRetries: 3
  batchSize: 10
  cacheSize: 1000
  cacheTtlMs: 30000

# Strategy configurations
strategies:
  arbitrage:
    enabled: true
    minProfitUSD: 8.0  # Lowered for Base L2 - more opportunities
    maxSlippageBps: 150  # 1.5% - more realistic
    maxGasPriceGwei: 0.5  # Base L2 typical gas
    maxPositionSize: 25000  # USD - reduced for safety
    cooldownMs: 1000  # Faster scanning on L2
    pairs:
      - "WETH/USDC"
      - "WETH/cbETH"
      - "USDC/USDbC"
    maxRoutes: 2  # Simplified routing
    fallbackRoutes: 1
    minSpreadBps: 10  # Lowered to catch more opportunities
    maxPriceImpactBps: 75  # 0.75%
    dexPriority:
      - "uniswap-v3"
      - "aerodrome"
    competitionThreshold: 2
    # Enhanced scanning parameters
    enableMultiHop: false  # Disabled for initial testing
    enableTriangularArbitrage: false  # Disabled for initial testing
    scanIntervalMs: 5000  # 5 seconds - optimized for zero-cost operation
    maxConcurrentScans: 2
    enablePoolDiscovery: false  # Manual pools only for now
    # Rate limiting protection
    rpcCallsPerSecond: 8  # Optimized for free tier
    maxRetries: 2
    retryDelayMs: 1000

  liquidation:
    enabled: false  # Phase 2
    minProfitUSD: 15.0  # Higher due to complexity
    maxSlippageBps: 250  # 2.5%
    maxGasPriceGwei: 100
    maxPositionSize: 50000
    cooldownMs: 5000
    minHealthFactor: 0.95
    maxCloseFactor: 0.5
    protocols:
      - "moonwell"
      - "aave-v3"
      - "seamless"
    minLiquidationBonus: 0.05
    maxLiquidationAmount: 100000
    healthFactorBuffer: 0.02

  rebalancing:
    enabled: false  # Phase 3
    minProfitUSD: 5.0  # Lower for stable swaps
    maxSlippageBps: 50  # 0.5%
    maxGasPriceGwei: 30
    maxPositionSize: 5000
    cooldownMs: 2000
    minImbalanceBps: 50
    incentiveThreshold: 0.1
    stablePools: []
    maxRebalanceAmount: 20000
    targetUtilization: 0.8

# Pool allowlists - OPTIMIZED FOR TOP 5 POOLS (ZERO-COST OPERATION)
# Reduced from 9 pools → 5 pools = -44% RPC calls
# Focus: Highest TVL & volume pairs for maximum profit per scan
allowedPools:
  uniswapV3:
    # WETH/USDbC 0.05% - Bridged USDC (verified working)
    - address: "0x4C36388bE6F416A29C8d8Eee81C771cE6bE14B18"
      dex: "uniswap-v3"
      enabled: true
      priority: 1
      minTvl: 100000
      maxSlippage: 0.015
      tags: ["high-volume", "bridged-usdc", "verified"]
    
    # WETH/DAI 0.3% - High liquidity (verified working)  
    - address: "0xc9034c3E7F58003E6ae0C8438e7c8f4598d5ACAA"
      dex: "uniswap-v3"
      enabled: true
      priority: 1
      minTvl: 100000
      maxSlippage: 0.015
      tags: ["high-volume", "verified"]
    
    # WETH/USDC 0.05% - Native USDC (verified working)
    - address: "0xd0b53D9277642d899DF5C87A3966A349A798F224"
      dex: "uniswap-v3"
      enabled: true
      priority: 1
      minTvl: 100000
      maxSlippage: 0.015
      tags: ["high-volume", "native-usdc", "verified"]

  # Aerodrome pools - Base's native DEX
  aerodrome:
    # TOP 5: WETH/USDC Volatile - $12M+ TVL, cross-DEX arb with UniV3
    - address: "0xcDAC0d6c6C59727a65F871236188350531885C43"
      dex: "aerodrome"
      enabled: true
      priority: 1
      minTvl: 100000
      maxSlippage: 0.02
      tags: ["volatile", "high-volume", "native-dex"]

# Token allowlists
allowedTokens:
  - address: "0x4200000000000000000000000000000000000006"  # WETH
    symbol: "WETH"
    decimals: 18
    enabled: true
    trusted: true
    maxAmount: 100
  - address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC
    symbol: "USDC"
    decimals: 6
    enabled: true
    trusted: true
    maxAmount: 200000

# Relay configuration
relays:
  primary: "bloxroute"  # Use bloXroute as primary (Flashbots not on Base)
  fallbacks:
    - "local"
  maxBribeGwei: 10
  retryAttempts: 3
  timeoutMs: 2000
  endpoints:
    flashbots:
      name: "Flashbots Protect"
      url: "https://rpc.flashbots.net"
      enabled: false  # NOT AVAILABLE ON BASE
      priority: 99
      maxLatencyMs: 500
      rateLimit: 100
    bloxroute:
      name: "bloXroute BDN"
      url: "https://base.bdn.blxrbdn.com"
      apiKey: "${BLOXROUTE_API_KEY:}"
      enabled: true
      priority: 1  # PRIMARY relay for Base
      maxLatencyMs: 300
      rateLimit: 1  # FREE tier: 1 bundle/sec (more than enough)
    local:
      name: "Local Node"
      url: "http://localhost:8545"
      enabled: true
      priority: 3
      maxLatencyMs: 100
      rateLimit: 1000

# Monitoring configuration
monitoring:
  metricsPort: 9090
  healthCheckPort: 8080
  logLevel: "info"
  alerting:
    consecutiveRevertThreshold: 5
    latencyThresholdMs: 300
    successRateThreshold: 0.7
    profitThresholdUSD: 1.0
    alerts:
      slack:
        enabled: false
        webhook: "${SLACK_WEBHOOK_URL:}"
        threshold: 3
        cooldownMs: 300000
      email:
        enabled: false
        email: "${ALERT_EMAIL:}"
        threshold: 5
        cooldownMs: 600000
  circuitBreaker:
    enabled: true
    failureThreshold: 5  # More aggressive for initial deployment
    recoveryTimeMs: 60000
    halfOpenMaxCalls: 3
    maxDailyLossUSD: 100  # Start with limited loss exposure

# Environment settings
environment: "development"
debug: true
dryRun: true  # SAFETY: Start in dry-run mode - set to false only after validation
paperTrading: true  # SAFETY: Simulate execution without signing txs