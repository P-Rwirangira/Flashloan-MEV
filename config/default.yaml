# Base MEV Platform Configuration
# This is the default configuration for the Base MEV platform

# Phase Configuration
phases:
  arbitrage:
    enabled: true
    priority: 1
  liquidations:
    enabled: false  # Enable for Phase 2
    priority: 2
  stablePoolRebalancing:
    enabled: false  # Enable for Phase 3
    priority: 3

# Feature Flags
featureFlags:
  enableLiquidationMonitoring: false
  enableStablePoolMonitoring: false
  enableAdvancedRouting: true
  enablePerformanceOptimizations: true
  enableMempoolMonitoring: false  # ❌ DISABLED: Not needed for cross-DEX arbitrage (only for backrun)
  enableCompetitionTracking: true

# Graceful Degradation
gracefulDegradation:
  enabled: true
  fallbackToArbitrageOnly: true
  maxConsecutiveFailures: 10
  autoRecovery: true
  recoveryCheckIntervalMs: 60000

# Network configuration
network:
  chainId: 8453  # Base mainnet
  name: "base"
  rpcUrl: "${BASE_RPC_URL:https://base-mainnet.g.alchemy.com/v2/FLUpiiYxfMvm29kJsQZBY}"
  wsUrl: "${BASE_WS_URL:wss://base-mainnet.g.alchemy.com/v2/FLUpiiYxfMvm29kJsQZBY}"
  fallbackRpcs:
    - "https://base-rpc.publicnode.com"
    - "https://base.llamarpc.com"
    - "https://base.meowrpc.com"
    - "https://mainnet.base.org"
    - "https://1rpc.io/base"
    - "https://rpc.ankr.com/base"

# DexScreener Integration (Zero RPC for monitoring!)
dexscreener:
  enabled: true
  apiUrl: "https://api.dexscreener.com/latest/dex"
  
  # Client configuration
  maxRequestsPerMinute: 250
  cacheTimeMs: 5000
  retryDelayMs: 2000
  maxRetries: 3
  timeout: 10000
  
  # Monitor configuration
  chain: "base"
  poolAddresses: []  # Will be populated from allowedPools
  minLiquidityUsd: 100000
  minVolume24hUsd: 10000
  updateIntervalMs: 5000
  enableAutoDiscovery: false
  maxStaleDataMs: 30000
  
  # Cross-DEX arbitrage scanner
  crossDexScanner:
    enabled: true
    minSpreadPercent: 0.05  # Lowered from 0.1% to catch more opportunities
    minProfitUsd: 5  # Lowered from 8 for Base L2 efficiency
    minConfidenceScore: 65  # Slightly lower for more opportunities
    maxPriceImpactPercent: 2.5  # Increased slightly for flexibility
    scanIntervalMs: 3000  # Faster scanning (3s vs 5s)
  
  # Multi-hop arbitrage scanner
  multiHopScanner:
    enabled: true
    maxHops: 4
    minSpreadPercent: 0.15  # Lowered from 0.2% for multi-hop
    minProfitUsd: 10  # Lowered from 15 for Base L2
    minConfidenceScore: 55  # Lower threshold for multi-hop complexity
    maxPriceImpactPercent: 4  # Higher tolerance for multi-hop
    scanIntervalMs: 8000  # Slightly faster (8s vs 10s)
    enabledTokens:
      - "0x4200000000000000000000000000000000000006"  # WETH
      - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC
      - "0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA"  # USDbC
      - "0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb"  # DAI
      - "0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22"  # cbETH
      - "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"  # cbBTC
  
  # Trending pair discovery
  discovery:
    enabled: true
    minLiquidityUsd: 250000  # Lowered from 500K to catch mid-tier opportunities
    minVolume24hUsd: 50000  # Lowered from 100K for long-tail tokens
    minVolume1hUsd: 5000  # Lowered from 10K for faster discovery
    maxPoolAge: 0  # 0 = no age limit
    scanIntervalMs: 120000  # 2 minutes (faster discovery from 5min)
    maxNewPoolsPerScan: 15  # Increased from 10
    whitelistedTokens:
      - "0x4200000000000000000000000000000000000006"  # WETH
      - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC
      - "0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA"  # USDbC
      - "0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb"  # DAI
      - "0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22"  # cbETH
      - "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"  # cbBTC
    blacklistedTokens: []
  
  # Orchestrator configuration
  orchestrator:
    enableCrossDex: true
    enableMultiHop: true
    enableDiscovery: true
    validateWithRpc: true
    maxPriceDiscrepancy: 1.0  # 1% max discrepancy
    executionEnabled: false
    paperTradingMode: true

# Gas configuration
gas:
  maxGasPrice: "${MAX_GAS_PRICE:50}"  # 50 gwei
  gasLimit: 500000
  priorityFee: "${PRIORITY_FEE:2}"
  baseFeeMultiplier: 1.2

# Timing configuration
timing:
  maxLatencyMs: 200
  timeoutMs: 5000
  retryDelayMs: 100
  maxRetries: 3
  simulationTimeoutMs: 50

# Security configuration
security:
  maxConcurrentTx: 5
  maxDailyLoss: 1000  # USD
  emergencyStop: false
  allowedCallers: []
  rateLimits:
    requestsPerSecond: 100
    burstSize: 200

# Performance configuration
performance:
  maxLatencyMs: 150
  simulationTimeoutMs: 50
  maxRetries: 3
  batchSize: 10
  cacheSize: 1000
  cacheTtlMs: 30000

# Strategy configurations
strategies:
  arbitrage:
    enabled: true
    minProfitUSD: 5.0  # Further lowered for Base L2 efficiency
    maxSlippageBps: 200  # 2% - increased for more opportunities
    maxGasPriceGwei: 0.5  # Base L2 typical gas
    maxPositionSize: 25000  # USD - reduced for safety
    cooldownMs: 1000  # Faster scanning on L2
    pairs:
      - "WETH/USDC"
      - "WETH/cbETH"
      - "WETH/cbBTC"
      - "WETH/DAI"
      - "USDC/USDbC"
      - "USDC/DAI"
      - "cbETH/USDC"
      - "cbBTC/USDC"
    maxRoutes: 2  # Simplified routing
    fallbackRoutes: 1
    minSpreadBps: 10  # Lowered to catch more opportunities
    maxPriceImpactBps: 75  # 0.75%
    dexPriority:
      - "uniswap-v3"
      - "aerodrome"
    competitionThreshold: 2
    # Enhanced scanning parameters
    enableMultiHop: false  # Disabled for initial testing
    enableTriangularArbitrage: false  # Disabled for initial testing
    scanIntervalMs: 5000  # 5 seconds - optimized for zero-cost operation
    maxConcurrentScans: 2
    enablePoolDiscovery: false  # Manual pools only for now
    # Rate limiting protection
    rpcCallsPerSecond: 8  # Optimized for free tier
    maxRetries: 2
    retryDelayMs: 1000

  liquidation:
    enabled: false  # Phase 2
    minProfitUSD: 15.0  # Higher due to complexity
    maxSlippageBps: 250  # 2.5%
    maxGasPriceGwei: 100
    maxPositionSize: 50000
    cooldownMs: 5000
    minHealthFactor: 0.95
    maxCloseFactor: 0.5
    protocols:
      - "moonwell"
      - "aave-v3"
      - "seamless"
    minLiquidationBonus: 0.05
    maxLiquidationAmount: 100000
    healthFactorBuffer: 0.02

  rebalancing:
    enabled: false  # Phase 3
    minProfitUSD: 5.0  # Lower for stable swaps
    maxSlippageBps: 50  # 0.5%
    maxGasPriceGwei: 30
    maxPositionSize: 5000
    cooldownMs: 2000
    minImbalanceBps: 50
    incentiveThreshold: 0.1
    stablePools: []
    maxRebalanceAmount: 20000
    targetUtilization: 0.8

