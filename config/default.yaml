# Base MEV Platform Configuration
# This is the default configuration for the Base MEV platform

# Phase Configuration
phases:
  arbitrage:
    enabled: true
    priority: 1
  liquidations:
    enabled: false  # Enable for Phase 2
    priority: 2
  stablePoolRebalancing:
    enabled: false  # Enable for Phase 3
    priority: 3

# Feature Flags
featureFlags:
  enableLiquidationMonitoring: false
  enableStablePoolMonitoring: false
  enableAdvancedRouting: true
  enablePerformanceOptimizations: true
  enableMempoolMonitoring: false  # ❌ DISABLED: Not needed for cross-DEX arbitrage (only for backrun)
  enableCompetitionTracking: true

# Graceful Degradation
gracefulDegradation:
  enabled: true
  fallbackToArbitrageOnly: true
  maxConsecutiveFailures: 10
  autoRecovery: true
  recoveryCheckIntervalMs: 60000

# Network configuration
network:
  chainId: 8453  # Base mainnet
  name: "base"
  rpcUrl: "${BASE_RPC_URL:https://base-rpc.publicnode.com}"
  wsUrl: "${BASE_WS_URL:wss://base-rpc.publicnode.com}"
  fallbackRpcs:
    - "https://base.llamarpc.com"
    - "https://base.meowrpc.com"
    - "https://mainnet.base.org"

# Gas configuration
gas:
  maxGasPrice: "${MAX_GAS_PRICE:50}"  # 50 gwei
  gasLimit: 500000
  priorityFee: "${PRIORITY_FEE:2}"
  baseFeeMultiplier: 1.2

# Timing configuration
timing:
  maxLatencyMs: 200
  timeoutMs: 5000
  retryDelayMs: 100
  maxRetries: 3
  simulationTimeoutMs: 50

# Security configuration
security:
  maxConcurrentTx: 5
  maxDailyLoss: 1000  # USD
  emergencyStop: false
  allowedCallers: []
  rateLimits:
    requestsPerSecond: 100
    burstSize: 200

# Performance configuration
performance:
  maxLatencyMs: 150
  simulationTimeoutMs: 50
  maxRetries: 3
  batchSize: 10
  cacheSize: 1000
  cacheTtlMs: 30000

# Strategy configurations
strategies:
  arbitrage:
    enabled: true
    minProfitUSD: 8.0  # Lowered for Base L2 - more opportunities
    maxSlippageBps: 150  # 1.5% - more realistic
    maxGasPriceGwei: 0.5  # Base L2 typical gas
    maxPositionSize: 25000  # USD - reduced for safety
    cooldownMs: 1000  # Faster scanning on L2
    pairs:
      - "WETH/USDC"
      - "WETH/cbETH"
      - "USDC/USDbC"
    maxRoutes: 2  # Simplified routing
    fallbackRoutes: 1
    minSpreadBps: 10  # Lowered to catch more opportunities
    maxPriceImpactBps: 75  # 0.75%
    dexPriority:
      - "uniswap-v3"
      - "aerodrome"
    competitionThreshold: 2
    # Enhanced scanning parameters
    enableMultiHop: false  # Disabled for initial testing
    enableTriangularArbitrage: false  # Disabled for initial testing
    scanIntervalMs: 3000  # 3 seconds - balanced for Base L2
    maxConcurrentScans: 3
    enablePoolDiscovery: false  # Manual pools only for now
    # Rate limiting protection
    rpcCallsPerSecond: 10  # Conservative to avoid rate limits
    maxRetries: 2
    retryDelayMs: 1000

  liquidation:
    enabled: false  # Phase 2
    minProfitUSD: 15.0  # Higher due to complexity
    maxSlippageBps: 250  # 2.5%
    maxGasPriceGwei: 100
    maxPositionSize: 50000
    cooldownMs: 5000
    minHealthFactor: 0.95
    maxCloseFactor: 0.5
    protocols:
      - "moonwell"
      - "aave-v3"
      - "seamless"
    minLiquidationBonus: 0.05
    maxLiquidationAmount: 100000
    healthFactorBuffer: 0.02

  rebalancing:
    enabled: false  # Phase 3
    minProfitUSD: 5.0  # Lower for stable swaps
    maxSlippageBps: 50  # 0.5%
    maxGasPriceGwei: 30
    maxPositionSize: 5000
    cooldownMs: 2000
    minImbalanceBps: 50
    incentiveThreshold: 0.1
    stablePools: []
    maxRebalanceAmount: 20000
    targetUtilization: 0.8

# Pool allowlists - VERIFIED BASE MAINNET POOLS
allowedPools:
  uniswapV3:
    # WETH/USDC 0.05% - High volume, most liquid pair on Base
    - address: "0x4C36388bE6F416A29C8d8Eee81C771cE6bE14B18"
      dex: "uniswap-v3"
      enabled: true
      priority: 1
      minTvl: 500000  # Reduced from 1M to catch more opportunities
      maxSlippage: 0.015  # 1.5% - more realistic for Base L2
      tags: ["high-volume", "stable", "primary"]
    
    # WETH/USDC 0.3% - Alternative fee tier
    - address: "0xd0b53D9277642d899DF5C87A3966A349A798F224"
      dex: "uniswap-v3"
      enabled: true
      priority: 2
      minTvl: 200000  # Reduced threshold
      maxSlippage: 0.025  # 2.5%
      tags: ["medium-volume", "alternative-fee"]
    
    # WETH/cbETH 0.05% - ETH derivatives arbitrage
    - address: "0x7B73644935b8e68019ac6356c40661E1bc315860"
      dex: "uniswap-v3"
      enabled: true
      priority: 3
      minTvl: 100000
      maxSlippage: 0.03
      tags: ["eth-derivatives", "medium-volume"]
    
    # USDC/USDbC 0.01% - Stablecoin arbitrage
    - address: "0x1fb3cf6e48F1E7B10213E7b6d87D4c073C7Fdb7b"
      dex: "uniswap-v3"
      enabled: true
      priority: 4
      minTvl: 50000
      maxSlippage: 0.005  # Tight for stablecoins
      tags: ["stablecoin", "low-risk"]

  # Aerodrome pools - Base's native DEX
  aerodrome:
    # WETH/USDC Volatile Pool
    - address: "0xcDAC0d6c6C59727a65F871236188350531885C43"
      dex: "aerodrome"
      enabled: true
      priority: 1
      minTvl: 100000
      maxSlippage: 0.02
      tags: ["volatile", "high-volume", "native-dex"]

# Token allowlists
allowedTokens:
  - address: "0x4200000000000000000000000000000000000006"  # WETH
    symbol: "WETH"
    decimals: 18
    enabled: true
    trusted: true
    maxAmount: 100
  - address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  # USDC
    symbol: "USDC"
    decimals: 6
    enabled: true
    trusted: true
    maxAmount: 200000

# Relay configuration
relays:
  primary: "bloxroute"  # Use bloXroute as primary (Flashbots not on Base)
  fallbacks:
    - "local"
  maxBribeGwei: 10
  retryAttempts: 3
  timeoutMs: 2000
  endpoints:
    flashbots:
      name: "Flashbots Protect"
      url: "https://rpc.flashbots.net"
      enabled: false  # NOT AVAILABLE ON BASE
      priority: 99
      maxLatencyMs: 500
      rateLimit: 100
    bloxroute:
      name: "bloXroute BDN"
      url: "https://base.bdn.blxrbdn.com"
      apiKey: "${BLOXROUTE_API_KEY:}"
      enabled: true
      priority: 1  # PRIMARY relay for Base
      maxLatencyMs: 300
      rateLimit: 1  # FREE tier: 1 bundle/sec (more than enough)
    local:
      name: "Local Node"
      url: "http://localhost:8545"
      enabled: true
      priority: 3
      maxLatencyMs: 100
      rateLimit: 1000

# Monitoring configuration
monitoring:
  metricsPort: 9090
  healthCheckPort: 8080
  logLevel: "info"
  alerting:
    consecutiveRevertThreshold: 5
    latencyThresholdMs: 300
    successRateThreshold: 0.7
    profitThresholdUSD: 1.0
    alerts:
      slack:
        enabled: false
        webhook: "${SLACK_WEBHOOK_URL:}"
        threshold: 3
        cooldownMs: 300000
      email:
        enabled: false
        email: "${ALERT_EMAIL:}"
        threshold: 5
        cooldownMs: 600000
  circuitBreaker:
    enabled: true
    failureThreshold: 5  # More aggressive for initial deployment
    recoveryTimeMs: 60000
    halfOpenMaxCalls: 3
    maxDailyLossUSD: 100  # Start with limited loss exposure

# Environment settings
environment: "development"
debug: true
dryRun: true  # SAFETY: Start in dry-run mode - set to false only after validation
paperTrading: true  # SAFETY: Simulate execution without signing txs